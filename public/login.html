<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinPredict PyME · Iniciar sesión</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="center-wrap">
    <form class="card login" id="form" autocomplete="on">
      <h1>FinPredict PyME</h1>
      <p class="small">Análisis y predicciones financieras para tu negocio.</p>
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="msg err" id="msg" hidden></div>
      <button class="btn" style="width:100%;margin-top:1rem" id="go">Entrar</button>
      <p class="small" style="margin-top:1rem">¿No tienes cuenta? Solicítala al administrador.</p>
    </form>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
