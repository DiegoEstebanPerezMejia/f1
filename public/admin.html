<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinPredict PyME · Administración</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="top">
    <span class="brand">FinPredict PyME · Administración</span>
    <span class="who">
      <span id="who"></span>
      <button class="btn secondary small" id="outBtn">Salir</button>
    </span>
  </header>
  <main>
    <div class="card">
      <h2>Crear usuario</h2>
      <form id="cForm">
        <div class="row">
          <div><label for="c_username">Usuario</label><input id="c_username" required minlength="3" autocomplete="off"></div>
          <div><label for="c_password">Contraseña (mín. 8)</label><input id="c_password" type="text" required minlength="8" autocomplete="off"></div>
          <div><label for="c_company">Empresa</label><input id="c_company" autocomplete="off"></div>
          <div><label for="c_role">Rol</label>
            <select id="c_role"><option value="user">Usuario (empresa)</option><option value="admin">Administrador</option></select>
          </div>
        </div>
        <div class="msg" id="cMsg" hidden></div>
        <button class="btn" style="margin-top:1rem">Crear usuario</button>
      </form>
    </div>
    <div class="card">
      <h2>Usuarios</h2>
      <div id="users"></div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
